{% comment %}
  Recuadro amarillo con una etiqueta y un valor para copiar (usuario, contraseña, código...).
  Uso: include "emails/_credential_box.html" with label="Usuario" value=email
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0 0 10px 0">
  <tr>
    <td
      style="
        background-color: #fef8ec;
        border: 1px solid #f5b551;
        border-radius: 8px;
        padding: 10px 14px;
      "
    >
      <div
        style="
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 1px;
          text-transform: uppercase;
          color: #a87028;
          margin: 0 0 2px 0;
        "
      >
        {{ label }}
      </div>
      <div
        style="
          font-family: &quot;Courier New&quot;, Courier, monospace;
          font-size: 15px;
          font-weight: 700;
          color: #0c1b2a;
          word-break: break-all;
          -webkit-user-select: all;
          user-select: all;
        "
      >
        {{ value }}
      </div>
    </td>
  </tr>
</table>
