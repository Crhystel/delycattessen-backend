name: CI Backend

# Pipeline por etapas. Los jobs 1, 2 y 3 corren en paralelo; el 4 (imagen) espera a
# los tres; 5 y 6 despliegan según la rama.
#
#   1 · Lint y checks ─┐
#   2 · Tests ─────────┼─► 4 · Imagen Docker ─► 5 · Staging (develop)
#   3 · Seguridad ─────┘                      └► 6 · Producción (main, con aprobación)
#
# Los valores de entorno de este archivo son FALSOS y solo sirven para los tests:
# no hay credenciales reales en el CI.

on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1 · Lint
  lint:
    name: "1 · Lint y checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key
      DB_NAME: delycattessen_ci
      DB_USER: ci
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      RABBITMQ_URL: memory://
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Sintaxis de todo el código
        run: python -m compileall -q -x '/(\.git|venv|\.venv)/' .

      - name: Verificación de Django
        run: python manage.py check

      - name: Migraciones al día (sin migraciones pendientes)
        run: python manage.py makemigrations --check --dry-run

  # ---------------------------------------------------------------- 2 · Tests
  tests:
    name: "2 · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: delycattessen_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key
      DB_NAME: delycattessen_ci
      DB_USER: ci
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      RABBITMQ_URL: memory://
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests con cobertura
        run: python -m pytest

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate")) * 100
          print("### Cobertura de tests")
          print()
          print(f"**{rate:.1f}%** de las líneas están cubiertas por los tests.")
          PY

      - name: Subir reporte de cobertura
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 3

  # ------------------------------------------------------------ 3 · Seguridad
  security:
    name: "3 · Seguridad de dependencias"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Informa las vulnerabilidades conocidas sin bloquear el pipeline: el
      # resultado queda en el resumen del job para revisarlo y actualizar versiones.
      - name: Auditar requirements.txt con pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off | tee audit.txt
          {
            echo "### pip-audit"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- 4 · Imagen
  build-image:
    name: "4 · Imagen Docker"
    needs: [lint, tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas.
      - name: Nombre de la imagen
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Solo se publica en push; en un PR la imagen se construye para validar el
      # Dockerfile pero no se sube a ningún lado.
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Construir (y publicar en push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- 5 · Staging
  deploy-staging:
    name: "5 · Deploy a staging"
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Registrar la versión lista para staging
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          {
            echo "### Staging: imagen publicada"
            echo
            echo "Imagen: \`${IMAGE}:develop\`"
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "En la máquina de staging:"
            echo '```bash'
            echo "docker compose -f docker-compose.staging.yml pull"
            echo "docker compose -f docker-compose.staging.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Despliegue automático opcional: solo si el entorno 'staging' define la
      # variable DEPLOY_HOST (y los secretos DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY).
      # Si no está definida, este paso se salta y el despliegue es manual.
      - name: Desplegar por SSH
        if: ${{ vars.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.staging.yml pull && docker compose -f docker-compose.staging.yml up -d"

  # --------------------------------------------------------- 6 · Producción
  deploy-production:
    name: "6 · Deploy a producción"
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configura "Required reviewers" en este entorno para exigir aprobación manual.
    environment: production
    steps:
      - name: Registrar la versión lista para producción
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          {
            echo "### Producción: imagen publicada"
            echo
            echo "Imagen: \`${IMAGE}:latest\`"
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "En la máquina de producción:"
            echo '```bash'
            echo "BACKEND_TAG=latest docker compose -f docker-compose.staging.yml pull"
            echo "BACKEND_TAG=latest docker compose -f docker-compose.staging.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Desplegar por SSH
        if: ${{ vars.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && BACKEND_TAG=latest docker compose -f docker-compose.staging.yml pull && BACKEND_TAG=latest docker compose -f docker-compose.staging.yml up -d"
